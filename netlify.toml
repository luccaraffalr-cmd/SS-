[build]
  command = "npm run build"
  publish = "dist"
  # No publicar (ni gastar créditos) si solo cambió algo que no es la app,
  # como los archivos SQL o la especificación.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src index.html package.json package-lock.json vite.config.js netlify.toml"

# Todas las direcciones abren la app (necesario para las pantallas internas).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
