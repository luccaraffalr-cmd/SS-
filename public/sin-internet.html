<!doctype html>
<!-- Lo muestra la app Android cuando no puede abrir la página (sin internet). -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, sans-serif; background: #f3f4f6; color: #111827; text-align: center; }
      main { padding: 24px 16px; max-width: 360px; }
      h1 { font-size: 1.4rem; }
      button { width: 100%; margin-top: 16px; padding: 16px; border: none; border-radius: 10px;
               background: #1f2937; color: #fff; font: inherit; font-weight: 600; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>📶 Sin conexión</h1>
      <p>No se pudo abrir la app. Revisá que el celular tenga internet (datos o WiFi).</p>
      <p><small>Si estabas compartiendo tu ubicación, se sigue mandando cuando vuelva la señal.</small></p>
      <button onclick="location.href = 'https://fastidious-cocada-43719b.netlify.app'">Reintentar</button>
    </main>
  </body>
</html>
